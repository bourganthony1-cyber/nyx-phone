<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nyx" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="icon-192.png" />
    <title>Nyx</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08080a;
        --card: #141419;
        --line: #26262e;
        --text: #ececf1;
        --muted: #8a8a94;
        --accent: #7c5cff;
        --live: #35d07f;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: max(28px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
        background: radial-gradient(120% 90% at 50% 0%, #16121f 0%, var(--bg) 60%);
        color: var(--text);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
        user-select: none;
      }
      h1 { margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -0.02em; }
      #state { color: var(--muted); font-size: 14px; min-height: 22px; text-align: center; max-width: 22rem; }
      .dot {
        display: inline-block; width: 9px; height: 9px; border-radius: 50%;
        background: var(--muted); margin-right: 9px; vertical-align: middle;
        transition: background 0.2s ease, box-shadow 0.2s ease;
      }
      .dot[data-live="true"] { background: var(--live); box-shadow: 0 0 12px var(--live); }
      button {
        appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
        font: inherit; font-weight: 650; padding: 22px 52px; border-radius: 999px; cursor: pointer;
        transition: transform 0.08s ease, border-color 0.2s ease, opacity 0.2s ease;
        min-width: 12rem;
      }
      button:active { transform: scale(0.97); }
      button[data-live="true"] { border-color: var(--live); }
      button:disabled { opacity: 0.4; cursor: default; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      .row button { padding: 16px 30px; min-width: 8rem; font-size: 15px; }
      #log {
        width: 100%; max-width: 26rem; max-height: 20vh; overflow-y: auto;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px;
        white-space: pre-wrap; user-select: text;
      }
      .warn {
        max-width: 26rem; border: 1px solid #5a3a1a; background: #1d1408; color: #e2b071;
        border-radius: 12px; padding: 13px 15px; font-size: 13px; line-height: 1.45;
      }
      input {
        width: 100%; max-width: 26rem; background: var(--card); border: 1px solid var(--line);
        color: var(--text); font: 13px/1.4 ui-monospace, monospace; padding: 13px 15px; border-radius: 10px;
        user-select: text;
      }
      #manual { display: none; flex-direction: column; gap: 10px; width: 100%; align-items: center; }
      footer { color: #55555e; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>Nyx</h1>

    <div id="warn"></div>

    <div>
      <span class="dot" id="dot"></span><span id="state">not connected</span>
    </div>

    <button id="join" type="button">Talk</button>

    <div class="row">
      <button id="mute" type="button" disabled>Mute</button>
      <button id="leave" type="button" disabled>End</button>
    </div>

    <div id="manual">
      <input id="tokenInput" type="text" placeholder="paste a join token" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <button id="connectManual" type="button">Connect</button>
    </div>

    <div id="log"></div>
    <footer>just talk — nothing to hold</footer>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <script>
      // The livekit URL is public information; only the join token is a credential.
      // Two ways in, in this order:
      //   1. a token in the URL fragment (#t=...) — older links still work;
      //   2. fetched from the token endpoint below, which mints one on demand.
      // (2) is why this page no longer needs Tony's laptop awake to hand it a fresh
      // link, and why the page URL itself is permanent. The key in the query string
      // is not a credential: it only reaches a server that already holds the secret.
      const LIVEKIT_URL = "wss://nyx-wjbvdcav.livekit.cloud";
      const TOKEN_ENDPOINT = "https://nyx-token.vercel.app/api/token?key=IP3x41SxsM46Sq9C5Xpwf86_mhneVc0l";

      const { Room, RoomEvent, Track } = LivekitClient;

      const joinBtn = document.getElementById("join");
      const muteBtn = document.getElementById("mute");
      const leaveBtn = document.getElementById("leave");
      const stateEl = document.getElementById("state");
      const dotEl = document.getElementById("dot");
      const logEl = document.getElementById("log");
      const warnEl = document.getElementById("warn");
      const manualEl = document.getElementById("manual");
      const tokenInput = document.getElementById("tokenInput");

      let room = null;
      let muted = false;
      let wakeLock = null;

      const log = (message) => {
        const stamp = new Date().toLocaleTimeString();
        logEl.textContent += `[${stamp}] ${message}\n`;
        logEl.scrollTop = logEl.scrollHeight;
      };

      const setState = (text, live) => {
        stateEl.textContent = text;
        dotEl.dataset.live = live ? "true" : "false";
      };

      const fragmentToken = () => {
        const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
        return hash.get("t") || hash.get("token") || "";
      };

      async function keepAwake(on) {
        try {
          if (on && "wakeLock" in navigator && !wakeLock) {
            wakeLock = await navigator.wakeLock.request("screen");
            wakeLock.addEventListener("release", () => { wakeLock = null; });
            log("screen will stay awake");
          } else if (!on && wakeLock) {
            await wakeLock.release();
            wakeLock = null;
          }
        } catch (error) {
          // A refused wake lock is not the user's problem: the screen may sleep, that's all.
          
        }
      }

      // Remote audio, routed for a LOUDSPEAKER.
      //
      // On iOS (and some Android builds) the moment a mic is live the audio session
      // becomes "play and record", and a plain <audio> element then plays out of the
      // EARPIECE — which is exactly what "it won't go to speaker" is. The fix that
      // actually works in a browser: hand the same track to Web Audio, whose output
      // goes to the loudspeaker. The element stays as a fallback, muted so the two
      // routes can't double up.
      let audioContext = null;

      async function attachAudio(track) {
        const audio = track.attach();
        audio.autoplay = true;
        audio.setAttribute("playsinline", "");
        audio.playsInline = true;
        document.body.appendChild(audio);
        log("she is talking");

        try {
          const Ctor = window.AudioContext || window.webkitAudioContext;
          if (!Ctor || !track.mediaStreamTrack) return;
          if (!audioContext) audioContext = new Ctor();
          if (audioContext.state === "suspended") await audioContext.resume();
          const source = audioContext.createMediaStreamSource(new MediaStream([track.mediaStreamTrack]));
          const gain = audioContext.createGain();
          gain.gain.value = 1;
          source.connect(gain).connect(audioContext.destination);
          audio.muted = true;
          log("speaker on");
        } catch (error) {
          log("speaker route blocked — using the phone default");
          audio.muted = false;
        }
      }

      async function join(token) {
        if (!token) {
          manualEl.style.display = "flex";
          setState("no token in this link — paste one", false);
          return;
        }
        joinBtn.disabled = true;
        setState("connecting…", false);

        try {
          room = new Room({ adaptiveStream: true, dynacast: true });

          room
            .on(RoomEvent.TrackSubscribed, (track) => {
              if (track.kind === Track.Kind.Audio) attachAudio(track);
            })
            .on(RoomEvent.ParticipantConnected, (p) => log("Nyx is in"))
            .on(RoomEvent.Disconnected, () => reset("disconnected"))
            .on(RoomEvent.ConnectionStateChanged, (s) => { if (s === "disconnected") log("disconnected"); });

          await room.connect(LIVEKIT_URL, token);
          log("connected to the room");

          await room.localParticipant.setMicrophoneEnabled(true);
          muted = false;
          muteBtn.disabled = false;
          leaveBtn.disabled = false;
          joinBtn.textContent = "Connected";
          joinBtn.dataset.live = "true";
          // Nothing to hold down. It used to read "Connected" while staying lit,
          // which looks like a button waiting to be pressed — it got held for most
          // of a call. Once you're in, the button goes away and the state line is
          // the indicator; Mute and Leave stay for control.
          joinBtn.disabled = true;
          joinBtn.style.display = "none";
          setState("● live — just talk, nothing to hold", true);
          await keepAwake(true);
        } catch (error) {
          setState("failed", false);
          log(`error: ${error.message || error}`);
          joinBtn.disabled = false;
        }
      }

      async function leave() {
        if (room) { await room.disconnect(); room = null; }
        await keepAwake(false);
        reset("left");
      }

      function reset(reason) {
        setState("not connected", false);
        joinBtn.textContent = "Talk";
        joinBtn.disabled = false;
        joinBtn.style.display = "";
        joinBtn.dataset.live = "false";
        muteBtn.disabled = true;
        leaveBtn.disabled = true;
        log(reason);
      }

      async function toggleMute() {
        if (!room) return;
        muted = !muted;
        await room.localParticipant.setMicrophoneEnabled(!muted);
        muteBtn.textContent = muted ? "Unmute" : "Mute";
        stateEl.textContent = muted ? "muted — tap Unmute" : "● live — just talk, nothing to hold";
      }

      async function fetchToken() {
        const response = await fetch(TOKEN_ENDPOINT, { cache: "no-store" });
        if (!response.ok) throw new Error(`token server said ${response.status}`);
        const data = await response.json();
        if (!data.token) throw new Error("token server returned no token");
        return data.token;
      }

      // Mint at the moment of the tap, not when the page loads: a page left open all
      // evening would otherwise try to connect with a token that expired while it sat.
      async function startFromTap() {
        let token = fragmentToken() || tokenInput.value.trim();
        if (!token) {
          setState("getting a token…", false);
          try {
            token = await fetchToken();
            log("ready — tap Talk");
          } catch (error) {
            setState("couldn't get a token", false);
            log(`error: ${error.message || error}`);
            manualEl.style.display = "flex";
            return;
          }
        }
        await join(token);
      }

      if (!window.isSecureContext) {
        warnEl.className = "warn";
        warnEl.textContent =
          "This page is not on https, so the browser will refuse the microphone. Open it over https.";
      }

      joinBtn.onclick = startFromTap;
      muteBtn.onclick = toggleMute;
      leaveBtn.onclick = leave;
      document.getElementById("connectManual").onclick = () => join(tokenInput.value.trim());

      if (fragmentToken()) {
        setState("token ready — tap Talk", false);
        log("ready — tap Talk");
      } else {
        setState("tap Talk — she picks up", false);
        log("tap Talk when you are ready");
      }
    </script>
  </body>
</html>
